[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pz-nvml-dcgm-exporter"
version = "1.0.0"
description = "Windows NVML exporter that speaks NVIDIA dcgm-exporter Prometheus format"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["nvidia", "nvml", "dcgm", "prometheus", "gpu", "exporter", "windows"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]
dependencies = [
    "nvidia-ml-py>=12.570.0",
    "pillow>=10.0.0",
    "pystray>=0.19.5",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11.0"]

[project.scripts]
pz-nvml-dcgm-exporter = "pz_nvml_dcgm_exporter.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pz_nvml_dcgm_exporter = ["assets/*.ico"]
